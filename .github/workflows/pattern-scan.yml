name: Background Formasyon Scan
on:
  push:
    paths:
      - 'pattern-scan-worker.js'
      - 'pattern-engine.js'
      - 'pattern-syntax-check.js'
      - 'pattern-matcher.js'
      - 'pattern-matcher-test.js'
      - '.github/workflows/pattern-scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: background-pattern-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and source checks
        run: |
          node --check pattern-scan-worker.js
          node --check pattern-matcher.js
          node --check pattern-engine.js
          node --check historical-pattern-engine.js
          node pattern-syntax-check.js
          node pattern-matcher-test.js
      - name: Scan top 500 coins on every timeframe
        run: node pattern-scan-worker.js
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update background pattern scan results"
            git fetch origin main
            git rebase origin/main
            git push
          fi
