
name: Update News

concurrency:
  group: update-news-main
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-news.yml"
      - "index.html"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install article extraction dependency
        run: pip install trafilatura

      - name: Fetch and classify global market news
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape

          # Direct publisher feeds: general markets plus dedicated crypto news desks.
          FEEDS = {
              "CNBC-e": [
                  ("CNBC-e", "https://www.cnbce.com/rss"),
              ],
              "Küresel Piyasalar": [
                  ("CNBC", "https://www.cnbc.com/id/100003114/device/rss/rss.html"),
                  ("MarketWatch", "https://feeds.marketwatch.com/marketwatch/topstories/"),
                  ("Investing.com", "https://www.investing.com/rss/news.rss"),
                  ("Yahoo Finance", "https://finance.yahoo.com/news/rssindex"),
                  ("Reuters", "https://news.google.com/rss/search?q=site:reuters.com+markets+OR+economy+OR+stocks&hl=en-US&gl=US&ceid=US:en"),
              ],
              "BBC News": [
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/rss.xml"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/economy/rss.xml"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/companies/rss.xml"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/world/rss.xml"),
              ],
              "Kripto Haberleri": [
                  ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/?outputType=xml"),
                  ("Cointelegraph", "https://cointelegraph.com/rss"),
                  ("Decrypt", "https://decrypt.co/feed"),
                  ("The Block", "https://www.theblock.co/rss.xml"),
                  ("CryptoSlate", "https://cryptoslate.com/feed/"),
                  ("Bitcoin Magazine", "https://bitcoinmagazine.com/feed"),
                  ("Bitcoin.com News", "https://news.bitcoin.com/feed/"),
              ],
              "Resmî Kurum Duyuruları": [
                  ("SEC · Resmî", "https://www.sec.gov/news/pressreleases.rss"),
                  ("CFTC · Resmî", "https://www.cftc.gov/RSS/RSSGP/rssgp.xml"),
                  ("CFTC · Resmî", "https://www.cftc.gov/RSS/RSSENF/rssenf.xml"),
              ],
          }

          def classify_cnbce_category(title, summary):
              text = (title + " " + summary).lower()
              rules = [
                  ("Fed & Faiz", ("fed ", "federal reserve", "interest rate", "interest rates", "central bank", "powell", "fomc", "treasury yield", "bond yield", "faiz", "merkez bankası", "tahvil faizi", "politika faizi")),
                  ("İstihdam & Enflasyon", ("inflation", "consumer prices", "producer prices", "employment", "unemployment", "jobs report", "payroll", "wage growth", "economic growth", "gdp", "cpi", "pce", "enflasyon", "istihdam", "işsizlik", "tarım dışı", "maaş", "gsyh")),
                  ("Petrol & Enerji", ("oil price", "crude oil", "brent", "wti", "natural gas", "energy market", "opec", "fuel price", "petrol", "doğalgaz", "doğal gaz", "enerji", "akaryakıt")),
                  ("Regülasyon", ("financial regulator", "regulator", "regulation", "regulatory", "sanction", "lawsuit", "sec ", "spk", "düzenleme", "regülasyon", "yaptırım", "yasak", "soruşturma")),
                  ("Kripto", (
                      "bitcoin", "btc", "ethereum", "ether", "eth", "cryptocurrency", "crypto", "binance", "coinbase",
                      "altcoin", "crypto etf", "blockchain", "token", "kripto", "digital asset", "digital assets",
                      "solana", "xrp", "ripple", "bnb", "dogecoin", "doge", "cardano", "ada coin", "toncoin",
                      "tron", "trx", "polkadot", "chainlink", "avalanche", "avax", "shiba inu", "shib",
                      "litecoin", "ltc", "bitcoin cash", "bch", "sui network", "aptos", "near protocol",
                      "arbitrum", "optimism", "pepe token", "uniswap", "aave", "makerdao", "cosmos",
                      "render token", "fetch.ai", "artificial superintelligence alliance", "bittensor", "tao token",
                      "ondo finance", "stellar", "xlm", "monero", "xmr", "hedera", "hbar", "vechain",
                      "the graph", "gala games", "immutable x", "injective", "inj token", "sei network",
                      "celestia", "tia token", "worldcoin", "wld token", "ethena", "ena token", "hyperliquid",
                      "hype token", "jupiter exchange", "jup token", "floki", "bonk", "kaspa", "kas token",
                      "crypto exchange", "crypto market", "crypto markets", "crypto prices", "crypto trading",
                      "crypto fund", "crypto funds", "crypto investor", "crypto investors", "crypto regulation",
                      "crypto regulations", "crypto crash", "crypto rally", "crypto sell-off", "crypto selloff"
                  )),
              ]
              for category, keywords in rules:
                  if any(keyword in text for keyword in keywords):
                      return category
              return "Küresel Piyasalar"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; VCryptoScope/1.0)"
          }

          def get_url(url, timeout=20):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def clean_text(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def extract_article_text(url, expected_title=""):
              """Extract a publisher article body and reject privacy/legal/consent pages."""
              if not url or not url.startswith(("https://", "http://")):
                  return ""
              try:
                  import trafilatura
                  request = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      final_url = response.geturl()
                      downloaded = response.read().decode("utf-8", errors="ignore")
                  if not downloaded or not final_url.startswith(("https://", "http://")):
                      return ""

                  host = urllib.parse.urlparse(final_url).netloc.lower()
                  allowed = (
                      "cnbc.com", "cnbc-e.com", "cnbce.com", "www.cnbce.com", "bbc.co.uk", "bbc.com",
                      "federalreserve.gov", "sec.gov", "cftc.gov", "coindesk.com", "cointelegraph.com"
                  )
                  if not any(host == domain or host.endswith("." + domain) for domain in allowed):
                      print(f"ARTICLE REJECTED: unexpected redirect host={host}")
                      return ""

                  extracted = trafilatura.extract(
                      downloaded, include_comments=False, include_tables=False,
                      favor_recall=True, output_format="txt"
                  ) or ""
                  extracted = clean_text(extracted)

                  # If the extractor returns a consent/privacy page, do not present it as news.
                  bad_markers = (
                      "california notice", "california consumer privacy act",
                      "your privacy choices", "privacy policy", "do not sell or share",
                      "versant's privacy", "versant privacy", "cookie policy",
                      "gestiona tus preferencias de privacidad", "avis de confidentialité"
                  )
                  lower = extracted.lower()
                  if any(marker in lower for marker in bad_markers):
                      print(f"ARTICLE REJECTED: privacy/legal page at {final_url}")
                      return ""

                  # Fallback to article paragraphs only, fixing the HTML regex boundaries.
                  if len(extracted) < 300:
                      fragment_match = re.search(
                          r'<(?:article|main)\b[^>]*>(.*?)</(?:article|main)>',
                          downloaded, re.I | re.S
                      )
                      fragment = fragment_match.group(1) if fragment_match else downloaded
                      fragment = re.sub(
                          r'<(script|style|nav|footer|header|aside)\b[^>]*>.*?</\1>',
                          ' ', fragment, flags=re.I | re.S
                      )
                      paragraphs = re.findall(r'<p\b[^>]*>(.*?)</p>', fragment, re.I | re.S)
                      extracted = clean_text(' '.join(paragraphs))
                      lower = extracted.lower()
                      if any(marker in lower for marker in bad_markers):
                          return ""

                  # Verify that this is the requested article page, not a site-wide
                  # privacy notice or a redirect page with unrelated text.
                  if expected_title:
                      title_match = re.search(
                          r'<title[^>]*>(.*?)</title>', downloaded, re.I | re.S
                      )
                      page_title = clean_text(title_match.group(1) if title_match else "").lower()
                      expected = clean_text(expected_title).lower()
                      terms = [w.lower() for w in re.findall(r"[a-z0-9]{4,}", expected)
                               if w.lower() not in {"with", "from", "that", "this", "after", "over", "into", "about"}]
                      title_terms = [w for w in re.findall(r"[a-z0-9]{4,}", page_title)
                                     if w not in {"cnbc", "bbc", "news", "latest", "breaking", "live"}]
                      if expected and expected not in page_title:
                          title_hits = sum(1 for word in terms if word in page_title)
                          if not terms or title_hits < max(2, int(len(terms) * 0.5)):
                              print(f"ARTICLE REJECTED: page title does not match headline; expected={expected_title[:80]!r}, page={page_title[:100]!r}")
                              return ""
                      if terms:
                          body_hits = sum(1 for word in terms if word in lower)
                          if body_hits < max(3, int(len(terms) * 0.4)):
                              print(f"ARTICLE REJECTED: article body does not match headline at {final_url}")
                              return ""
                  return extracted if len(extracted) >= 300 else ""
              except Exception as exc:
                  print(f"Publisher article extraction failed for {url[:120]}: {exc}")
                  return ""

          def translate_tr(text):
              if not text:
                  return ""
              try:
                  # Translation endpoint has practical URL limits; translate the full text in chunks.
                  chunks = []
                  remaining = text
                  while remaining:
                      if len(remaining) <= 3500:
                          chunks.append(remaining)
                          break
                      split_at = max(
                          remaining.rfind(". ", 0, 3500),
                          remaining.rfind("! ", 0, 3500),
                          remaining.rfind("? ", 0, 3500),
                          remaining.rfind("\\n", 0, 3500)
                      )
                      if split_at < 1200:
                          split_at = 3500
                      chunks.append(remaining[:split_at + 1])
                      remaining = remaining[split_at + 1:].lstrip()
                  translated_chunks = []
                  for chunk in chunks:
                      query = urllib.parse.urlencode({
                          "client": "gtx", "sl": "auto", "tl": "tr",
                          "dt": "t", "q": chunk,
                      })
                      url = "https://translate.googleapis.com/translate_a/single?" + query
                      data = json.loads(get_url(url).decode("utf-8"))
                      translated_chunks.append("".join(
                          part[0] for part in data[0] if part and part[0]
                      ))
                      time.sleep(0.1)
                  return "\\n\\n".join(translated_chunks).strip() or text
              except Exception as exc:
                  print(f"Translation error: {exc}")
                  return text

          def published_date(value):
              if not value:
                  return datetime.now(timezone.utc).isoformat()
              try:
                  dt = parsedate_to_datetime(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc).isoformat()
              except Exception:
                  return datetime.now(timezone.utc).isoformat()

          def classify_importance(title, summary, category):
              text = (title + " " + summary).lower()
              high_words = [
                  "rate decision", "interest rate", "fed", "fomc",
                  "inflation", "cpi", "pce", "jobs report", "nonfarm",
                  "unemployment", "opec", "oil supply", "sec approves",
                  "etf approval", "recession", "emergency", "crash",
                  "surge", "record high", "sanction"
              ]
              medium_words = [
                  "forecast", "outlook", "earnings", "fund flows",
                  "treasury", "yield", "brent", "wti", "regulation",
                  "economic growth", "dollar index"
              ]
              if any(word in text for word in high_words):
                  return "Yüksek"
              if category in ("Fed & Faiz", "İstihdam & Enflasyon"):
                  return "Orta"
              if any(word in text for word in medium_words):
                  return "Orta"
              return "Normal"

          def infer_impact(category):
              impacts = {
                  "Kripto": "Kripto fiyatları, fon akışları ve risk iştahı üzerindeki olası etkileri takip edin.",
                  "Fed & Faiz": "Faiz beklentileri dolar, tahvil getirileri, hisse senetleri ve kripto varlıkları etkileyebilir.",
                  "İstihdam & Enflasyon": "Veri, Fed'in faiz politikası ve piyasalardaki risk iştahı için önemli olabilir.",
                  "Petrol & Enerji": "Petrol fiyatları enflasyon beklentilerini, enerji şirketlerini ve küresel büyümeyi etkileyebilir.",
                  "Regülasyon": "Düzenleyici kararlar kripto varlıklara erişimi ve kurumsal yatırımları etkileyebilir.",
                  "Küresel Piyasalar": "Dolar, tahvil getirileri ve küresel risk iştahındaki değişimler farklı piyasalara yansıyabilir.",
              }
              return impacts.get(category, "")

          items = []
          seen = set()
          extraction_stats = {"attempted": 0, "success": 0, "sentences": 0}

          for category, queries in FEEDS.items():
              category_items = []

              for source_name, rss_url in queries:
                  try:
                      root = ET.fromstring(get_url(rss_url))
                      nodes = root.findall(".//item")
                      if not nodes:
                          nodes = root.findall(".//{*}entry")

                      for node in nodes:
                          title = clean_text(node.findtext("title", ""))
                          summary = clean_text(
                              node.findtext("description", "")
                              or node.findtext("{*}summary", "")
                              or node.findtext("{*}content", "")
                          )
                          link_node = node.find("link")
                          url = ""
                          if link_node is not None:
                              url = (link_node.text or link_node.attrib.get("href", "") or "").strip()
                          published = published_date(
                              node.findtext("pubDate", "")
                              or node.findtext("{*}published", "")
                              or node.findtext("{*}updated", "")
                          )

                          if not title or not url:
                              continue
                          if url.startswith("/"):
                              continue

                          key = url.split("?utm_")[0].strip()
                          if key in seen:
                              continue
                          seen.add(key)

                          category_items.append({
                              "title": title,
                              "summary": summary,
                              "url": url,
                              "source": source_name,
                              "sourceType": "Resmî kurum" if source_name.endswith("Resmî") else "Haber kuruluşu",
                              "verification": "Birincil kaynak" if source_name.endswith("Resmî") else "Editoryal haber; resmî duyuru olarak değerlendirilmemeli",
                              "publishedAt": published,
                              "category": "Küresel Piyasalar",
                          })

                  except Exception as exc:
                      print(f"Direct publisher feed error [{category}] [{source_name} {rss_url}]: {exc}")

                  time.sleep(0.3)

              category_items.sort(
                  key=lambda item: item["publishedAt"],
                  reverse=True
              )

              for item_index, item in enumerate(category_items[:25]):
                  print("Translating:", item["title"][:100])
                  item["titleTr"] = translate_tr(item["title"])
                  item["summaryTr"] = translate_tr(item["summary"])
                  # Classify using both original-language and Turkish text so BBC headlines
                  # are not incorrectly dumped into the global-markets section.
                  item["category"] = classify_cnbce_category(
                      item["title"] + " " + item["titleTr"],
                      item["summary"] + " " + item["summaryTr"]
                  )
                  # Full article extraction is reserved for the six newest stories in each source group.
                  # All 100 headlines still receive translated titles and summaries.
                  if item_index < 6:
                      extraction_stats["attempted"] += 1
                      article_text = extract_article_text(item["url"], item["title"])
                      # Publish only real publisher text; never pad a headline with generic prose.
                      if article_text and len(article_text) > len(item["title"]) + 250:
                          translated = translate_tr(article_text)
                          item["articleText"] = article_text
                          item["articleTextTr"] = translated
                          sentence_count = len(re.findall(r"[^.!?]+[.!?]+", translated))
                          extraction_stats["success"] += 1
                          extraction_stats["sentences"] += sentence_count
                          print(f"ARTICLE TEXT OK: {item['source']} | chars={len(translated)} | sentences={sentence_count} | {item['title'][:90]}")
                      else:
                          item["articleText"] = ""
                          item["articleTextTr"] = ""
                          print(f"ARTICLE TEXT MISSING: {item['source']} | {item['title'][:90]}")
                  else:
                      item["articleText"] = ""
                      item["articleTextTr"] = ""
                  item["importance"] = classify_importance(
                      item["title"], item["summary"], item["category"]
                  )
                  item["marketImpactTr"] = infer_impact(item["category"])
                  items.append(item)
                  time.sleep(0.15)

          items.sort(
              key=lambda item: item["publishedAt"],
              reverse=True
          )
          items = items[:100]

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(items),
              "articles": items,
              "news": items,
              "items": items,
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Saved {len(items)} news items (target: 100).")
          print(f"ARTICLE EXTRACTION SUMMARY: {extraction_stats['success']}/{extraction_stats['attempted']} articles with body; translated sentences total={extraction_stats['sentences']}.")
          if extraction_stats["attempted"] and extraction_stats["success"] == 0:
              print("WARNING: No publisher article bodies were extracted; do not treat summaries as full articles.")
          from collections import Counter
          category_counts = Counter(item["category"] for item in items)
          print("Category distribution:", json.dumps(category_counts, ensure_ascii=False, sort_keys=True))
          print("Sources:", json.dumps(dict(Counter(item["source"] for item in items)), ensure_ascii=False))
          PY

      - name: Commit and push updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Update market news"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
