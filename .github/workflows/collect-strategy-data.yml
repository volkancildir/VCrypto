name: Collect Historical Strategy Data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect closed candle history
        run: node strategy-backtest-data.js
      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy-backtest-data.json
          git diff --cached --quiet || (git commit -m "Update historical strategy data" && git push)
