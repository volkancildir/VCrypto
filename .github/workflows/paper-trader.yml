name: VCrypto Paper Portfolio

on:
  push:
    branches: ["main"]
    paths:
      - "paper-trader-worker.js"
      - ".github/workflows/paper-trader.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reset_strategy:
        description: 'Sıfırlanacak strateji (none = sıfırlama yok)'
        required: true
        type: choice
        default: none
        options:
          - none
          - alSat
          - formasyon
          - birlesik

permissions:
  contents: write

concurrency:
  group: vcrypto-paper-portfolio
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run paper trading simulation
        env:
          RESET_STRATEGY: ${{ inputs.reset_strategy }}
        run: node paper-trader-worker.js
      - name: Save portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-portfolio.json
          if git diff --cached --quiet; then
            echo "No portfolio state changes."
          else
            git commit -m "Update virtual portfolio state"
            git push
          fi
