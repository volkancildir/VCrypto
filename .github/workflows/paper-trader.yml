name: VCrypto Paper Portfolio

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vcrypto-paper-portfolio
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run paper trading simulation
        run: node paper-trader-worker.js
      - name: Save portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-portfolio.json
          if git diff --cached --quiet; then
            echo "No portfolio state changes."
          else
            git commit -m "Update virtual portfolio state"
            git push
          fi
